<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가상 로그인</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f9f9f9; }
    .login-card { background: white; padding: 2rem; border-radius: 8px; border: 1px solid #ddd; width: 300px; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.3rem; }
    input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { width: 100%; padding: 0.7rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    #msg { margin-top: 1rem; font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>가상 로그인</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" required placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" required placeholder="1234">
      </div>
      <button type="submit">로그인하기</button>
    </form>
    <div id="msg"></div>
    <p style="text-align: center; margin-top: 1rem;"><a href="/">← 메인으로 돌아가기</a></p>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      
      const msgDiv = document.getElementById('msg');
      if (data.success) {
        msgDiv.style.color = 'green';
      } else {
        msgDiv.style.color = 'red';
      }
      msgDiv.innerText = data.message;
    }
  </script>
</body>
</html>
